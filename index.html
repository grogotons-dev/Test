<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Hash Mining</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="glass">
    <h2 id="username">Miner</h2>
    <div class="stats">
      <div>⚡ <span id="hash">0</span> Hash</div>
      <div>💰 <span id="balance">0</span> HC</div>
      <div class="income">+<span id="income">0</span> HC / sec</div>
    </div>
  </header>

  <main id="screen" class="glass"></main>
</div>

<nav class="bottom-nav glass">
  <button onclick="openScreen('main')" class="active">
    💰<span>Баланс</span>
  </button>
  <button onclick="openScreen('shop')">
    🛒<span>Магазин</span>
  </button>
  <button onclick="openScreen('ads')">
    📺<span>Реклама</span>
  </button>
  <button onclick="openScreen('profile')">
    ⚙️<span>Профиль</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
