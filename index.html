<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok Invest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <!-- Панель настроек звука -->
  <div id="settingsPanel" class="settings-panel glass">
    <h3>🎵 Настройки звука</h3>
    
    <div class="slider-container">
      <div class="slider-label">
        <span>Громкость звуков</span>
        <span id="sfxValue">50%</span>
      </div>
      <input type="range" min="0" max="100" value="50" class="slider" id="sfxSlider">
    </div>
    
    <div class="slider-container">
      <div class="slider-label">
        <span>Громкость музыки</span>
        <span id="musicValue">40%</span>
      </div>
      <input type="range" min="0" max="100" value="40" class="slider" id="musicSlider">
    </div>
    
    <div class="slider-container">
      <div class="slider-label">
        <span>Громкость атмосферы</span>
        <span id="ambientValue">30%</span>
      </div>
      <input type="range" min="0" max="100" value="30" class="slider" id="ambientSlider">
    </div>
    
    <div style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
      💡 Атмосферные звуки меняются в зависимости от вашего дохода
    </div>
  </div>

  <!-- Кнопки управления звуком -->
  <div class="audio-controls">
    <div id="settingsBtn" class="audio-btn" onclick="toggleSettings()">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2"/>
        <path d="M12 5v1m0 12v1m5-9h1M6 12h1m8-7 1 1m-10 10 1 1m10-10 1-1m-10 10 1-1"/>
      </svg>
    </div>
    
    <div id="musicBtn" class="audio-btn" onclick="toggleMusic()">
      <svg id="musicIcon" viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    
    <div id="ambientBtn" class="audio-btn" onclick="toggleAmbient()">
      <svg id="ambientIcon" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>
    
    <div id="sfxBtn" class="audio-btn" onclick="toggleSFX()">
      <svg id="sfxIcon" viewBox="0 0 24 24">
        <path d="M12 2L9 5H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3l3 3v-16Z"/>
        <path d="M17 9a5 5 0 0 1 0 6"/>
        <path d="M19 7a9 9 0 0 1 0 10"/>
      </svg>
    </div>
  </div>

  <!-- Индикатор атмосферы -->
  <div class="ambient-indicator" id="ambientIndicator">
    <div class="ambient-dot"></div>
    <div class="ambient-dot"></div>
    <div class="ambient-dot"></div>
    <div class="ambient-dot"></div>
  </div>

  <header class="glass">
    <h2 id="username">Player</h2>
    <div class="stats">
      <div class="balance">
        <svg class="mini-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
        <b><span id="balance">0</span> GRK</b>
      </div>
      <div class="income">
        <svg class="mini-icon" viewBox="0 0 24 24">
          <path d="M3 17l6-6 4 4 7-7"/>
        </svg>
        <span id="income">0</span> GRK / сек
      </div>
    </div>
  </header>

  <main id="screen" class="glass"></main>
</div>

<nav class="bottom-nav">
  <button class="active" onclick="openScreen('home', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 2 3 9l9 13 9-13-9-7Z"/>
    </svg>
    <span>Главная</span>
  </button>

  <button onclick="openScreen('shop', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="4" y="6" width="16" height="12" rx="2"/>
      <circle cx="9" cy="12" r="2"/>
      <circle cx="15" cy="12" r="2"/>
    </svg>
    <span>Магазин</span>
  </button>

  <button onclick="openScreen('tasks', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2"/>
      <path d="M9 9h6M9 13h6M9 17h4"/>
    </svg>
    <span>Задания</span>
  </button>

  <button onclick="openScreen('refs', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3"/>
      <circle cx="6" cy="16" r="3"/>
      <circle cx="18" cy="16" r="3"/>
      <path d="M9 10l-2 3M15 10l2 3"/>
    </svg>
    <span>Рефералы</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
