<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok Invest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <header class="glass header-card">
    <h2 id="username">Player</h2>

    <div class="stats-row">
      <div class="balance-box">
        <div class="coin-icon">◈</div>
        <div>
          <div class="balance-value"><span id="balance">300.00</span> GRK</div>
        </div>
      </div>

      <div class="income-box">
        <svg class="speed-icon" viewBox="0 0 24 24">
          <path d="M3 17l6-6 4 4 7-7"/>
        </svg>
        <div class="income-text">
          <span id="income">0.0000</span> GRK / сек
        </div>
      </div>
    </div>
  </header>

  <main id="screen" class="glass main-card">
    <h1>300.00 GRK</h1>
    <p>Доход: 0.0000 GRK / сек</p>

    <div class="actions">
      <button class="btn-deposit">⬆ Пополнить</button>
      <button class="btn-withdraw">⬇ Вывести</button>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <button class="active">
    <span class="nav-icon">◈</span>
    <span>Главная</span>
  </button>
  <button>
    <span class="nav-icon">⛏</span>
    <span>Магазин</span>
  </button>
  <button>
    <span class="nav-icon">📄</span>
    <span>Задания</span>
  </button>
  <button>
    <span class="nav-icon">🔗</span>
    <span>Рефералы</span>
  </button>
</nav>

</body>
</html>
