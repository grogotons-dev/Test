<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Hash Mining Idle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h2 id="username">Miner</h2>
    <div class="stats">
      <div>⚡ Hash Power: <span id="hash">0</span></div>
      <div>💰 Balance: <span id="balance">0</span> HC</div>
      <div>📈 Income/sec: <span id="income">0</span> HC</div>
    </div>
  </header>

  <main id="screen"></main>
</div>

<nav class="nav">
  <button onclick="openScreen('main')">💰</button>
  <button onclick="openScreen('shop')">🛒</button>
  <button onclick="openScreen('ads')">📺</button>
  <button onclick="openScreen('refs')">👥</button>
  <button onclick="openScreen('profile')">⚙️</button>
</nav>

<script src="app.js"></script>
</body>
</html>
