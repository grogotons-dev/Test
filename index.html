<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok Invest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <!-- Кнопка настроек -->
  <div id="settingsBtn" class="settings-btn" onclick="toggleSettings()">
    <svg viewBox="0 0 24 24">
      <!-- Гаечный ключ в стиле других иконок -->
      <path d="M14 7l-1.5-1.5L14 4l1.5 1.5L14 7z"/>
      <path d="M10 11l-1.5-1.5L10 8l1.5 1.5L10 11z"/>
      <path d="M16 9l-1.5-1.5L16 6l1.5 1.5L16 9z"/>
      <path d="M8 17l-1.5-1.5L8 14l1.5 1.5L8 17z"/>
      <circle cx="12" cy="12" r="2"/>
    </svg>
  </div>

  <!-- Панель настроек -->
  <div id="settingsPanel" class="settings-panel glass">
    <div class="settings-section">
      <div class="settings-title">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L9 5H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3l3 3v-16Z"/>
          <path d="M17 9a5 5 0 0 1 0 6"/>
          <path d="M19 7a9 9 0 0 1 0 10"/>
        </svg>
        <span id="settingsSoundTitle">Звук</span>
      </div>
      
      <div class="volume-control">
        <div class="volume-header">
          <div class="volume-label" id="sfxLabel">Звуки эффектов</div>
          <div class="volume-value" id="sfxValue">50%</div>
        </div>
        <div class="volume-slider-container">
          <svg class="volume-icon" viewBox="0 0 24 24">
            <path d="M12 2L9 5H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3l3 3v-16Z"/>
          </svg>
          <input type="range" min="0" max="100" value="50" class="volume-slider" id="sfxSlider">
        </div>
      </div>
      
      <div class="volume-control">
        <div class="volume-header">
          <div class="volume-label" id="musicLabel">Фоновая музыка</div>
          <div class="volume-value" id="musicValue">30%</div>
        </div>
        <div class="volume-slider-container">
          <svg class="volume-icon" viewBox="0 0 24 24">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <input type="range" min="0" max="100" value="30" class="volume-slider" id="musicSlider">
        </div>
      </div>
    </div>
    
    <div class="settings-section">
      <div class="settings-title">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12" y2="16"/>
        </svg>
        <span id="settingsLangTitle">Язык</span>
      </div>
      
      <div class="language-switcher">
        <button id="langRu" class="lang-btn active" onclick="setLanguage('ru')">
          <span>🇷🇺</span> Русский
        </button>
        <button id="langEn" class="lang-btn" onclick="setLanguage('en')">
          <span>🇺🇸</span> English
        </button>
      </div>
    </div>
    
    <div style="margin-top: 20px; font-size: 13px; opacity: 0.7; text-align: center; line-height: 1.5;">
      <span id="settingsInfo">💡 Настройки сохраняются автоматически</span>
    </div>
  </div>

  <header class="glass">
    <h2 id="username">Player</h2>
    <div class="stats">
      <div class="balance">
        <svg class="mini-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
        <b><span id="balance">0</span> <span id="currency">GRK</span></b>
      </div>
      <div class="income">
        <svg class="mini-icon" viewBox="0 0 24 24">
          <path d="M3 17l6-6 4 4 7-7"/>
        </svg>
        <span id="income">0</span> <span id="perSecond">GRK / сек</span>
      </div>
    </div>
  </header>

  <main id="screen" class="glass">
    <!-- Контент будет рендериться через JS -->
  </main>
</div>

<nav class="bottom-nav">
  <button class="active" onclick="openScreen('home', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 2 3 9l9 13 9-13-9-7Z"/>
    </svg>
    <span id="navHome">Главная</span>
  </button>

  <button onclick="openScreen('shop', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="4" y="6" width="16" height="12" rx="2"/>
      <circle cx="9" cy="12" r="2"/>
      <circle cx="15" cy="12" r="2"/>
    </svg>
    <span id="navShop">Магазин</span>
  </button>

  <button onclick="openScreen('tasks', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2"/>
      <path d="M9 9h6M9 13h6M9 17h4"/>
    </svg>
    <span id="navTasks">Задания</span>
  </button>

  <button onclick="openScreen('refs', this)">
    <svg class="icon" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3"/>
      <circle cx="6" cy="16" r="3"/>
      <circle cx="18" cy="16" r="3"/>
      <path d="M9 10l-2 3M15 10l2 3"/>
    </svg>
    <span id="navRefs">Рефералы</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
